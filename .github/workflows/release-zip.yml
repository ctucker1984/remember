# Build WordPress plugin zip with root folder "remember/" on each published release.
# Use the attached remember.zip (or remember-x.y.z.zip) — not GitHub "Source code".

name: Release plugin zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build remember.zip
        run: bash bin/build-plugin-zip.sh

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/remember.zip
            dist/remember-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
